<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Charleston Tides</title>

  <link rel="stylesheet" href="style.css" />

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="container">
    <h1>Charleston Tide Predictions</h1>

    <button id="loadBtn">Load Today's Tides</button>

    <div id="status"></div>

    <canvas id="tideChart"></canvas>

    <table id="tideTable">
      <thead>
        <tr>
          <th>Time</th>
          <th>Height (ft)</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script src="app.js"></script>
</body>
</html>
