<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Charleston Tides</title>

  <link rel="stylesheet" href="style.css" />

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="container">
    <h1>Charleston Tide Predictions</h1>

        <label for="stationSelect">Station:</label>

          <select id="stationSelect">
            <option value="8665530">Charleston Harbor, SC</option>
            <!-- <option value="8666652">Folly Beach, SC</option> -->
            <!-- <option value="8666483">Isle of Palms, SC</option> -->
            <!-- <option value="8665958">Mount Pleasant, SC</option> -->
            <!-- <option value="8664442">Bulls Bay, SC</option> -->
            <!-- <option value="8664750">Awendaw, SC</option> -->
            <!-- <option value="8667999">Beaufort, SC</option> -->
            <option value="8670870">Savannah, GA</option>
          </select>

        <button id="loadBtn">Load Today's Tides</button>

    <div id="status"></div>

    <canvas id="tideChart"></canvas>

<details class="dataSection">
  <summary>Predicted Tide Data</summary>

  <table id="predictionTable">
    <thead>
      <tr>
        <th>Time</th>
        <th>Predicted Height (ft)</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</details>

<details class="dataSection">
  <summary>Observed Water Levels</summary>

  <table id="observedTable">
    <thead>
      <tr>
        <th>Time</th>
        <th>Observed Height (ft)</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</details>

<details class="dataSection">
  <summary>Diagnostics</summary>

  <div id="diagnostics">
    No diagnostics available.
  </div>
</details>
  </div>

  <script src="app.js"></script>
</body>
</html>
